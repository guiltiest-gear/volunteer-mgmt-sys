<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacramento State Career Center</title>
    <link rel="stylesheet" href="css/styles.css" />

    <style></style>
  </head>
  <body>
    <!-- navigation bar -->
    <div class="navbar">
      <div class="logo">
        <a href="index.html">
          <img
            src="https://images.squarespace-cdn.com/content/v1/5e7bccc44c932c510af9fc1c/1646328735683-BQ15AYSZ17BNCR5GMXX6/SacramentoState_1color.png"
            alt="Sac State Logo"
            style="height: 42px; width: 42px"
          />
        </a>
      </div>

      <div class="nav-links">
        <a onclick="navigate('Events')">Events</a>
        <a onclick="navigate('Newsletter')">Newsletter</a>
        <a onclick="navigate('About Us')">About Us</a>
        <a onclick="navigate('Resources')">Resources</a>
        <a onclick="navigate('FAQ')">FAQ</a>
      </div>

      <div class="nav-actions">
        <!-- button for profile-->
        <button class="btn" onclick="navigate('signin.html')">Sign In</button>
        <!-- button for sing out-->
        <button class="btn" onclick="navigate('signup.html')">Sign Up</button>
      </div>
    </div>

    <div class="signup-container">
      <h2>Create Account</h2>

      <form id="signupForm">
        <select id="role" name="role" required>
          <option value="">Select Role</option>
          <option value="volunteer">Volunteer</option>
          <option value="organization">Administrator</option>
        </select>
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input
          type="email"
          id="confirmEmail"
          placeholder="Confirm Email"
          required
        />
        <a style="font-size: 8px"
          >Password must include at least 6 characters, 1 uppercase letter, 1
          lowercase letter, 1 number, and 1 special character.</a
        >
        <input type="password" id="password" placeholder="Password" required />
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          required
        />
        <button type="submit">Sign Up</button>
      </form>

      <p id="message"></p>
    </div>

    <script src="signup.js"></script>

    <!-- footer -->
    <div class="footer">
      <div class="footer-logo">
        <img
          src="https://images.squarespace-cdn.com/content/v1/5e7bccc44c932c510af9fc1c/1646328735683-BQ15AYSZ17BNCR5GMXX6/SacramentoState_1color.png"
          alt="Logo Mini"
          style="height: 32px; width: 32px"
        />
      </div>
      <a href="https://www.csus.edu/" target="_blank"
        >California State University, Sacramento</a
      >
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>
  </body>
</html>
